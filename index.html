<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox PEP</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #10192e;
    --bg-panel: #182238;
    --line: #2c3752;
    --navy: #14213d;
    --brand-red: #c41230;
    --normal: #f0a202;
    --green: #2fa360;
    --text-primary: #e7eaf0;
    --text-dim: #8a93a8;
    --radius: 4px;
  }
  html[data-theme="day"]{
    --bg: #eef1f7;
    --bg-panel: #ffffff;
    --line: #dde1ea;
    --text-primary: #1a2035;
    --text-dim: #6b7488;
  }
  html{transition:background 0.2s ease;}
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text-primary);
    font-family:Calibri,'Segoe UI',Candara,Optima,Arial,sans-serif;
  }
  .top-bar{ height:4px; background:var(--brand-red); }

  /* LOGIN SCREEN */
  .login-wrap{
    min-height:calc(100vh - 4px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#10192e;
  }
  .login-card{
    background:#182238;
    border:1px solid #2c3752;
    border-radius:var(--radius);
    padding:32px 28px;
    width:100%;
    max-width:360px;
  }
  .login-logo{
    display:block;
    height:178px;
    width:auto;
    margin:0 auto 18px;
  }
  .login-card h1{
    font-size:20px;
    text-align:center;
    margin:0 0 4px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#e7eaf0;
  }
  .login-card p.sub{
    text-align:center;
    color:#8a93a8;
    font-size:13px;
    margin:0 0 24px;
  }
  .field-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#8a93a8;
    display:block;
    margin-bottom:6px;
  }
  .login-card input{
    width:100%;
    background:#10192e;
    border:1px solid #2c3752;
    color:#e7eaf0;
    padding:10px 12px;
    border-radius:var(--radius);
    font-size:14px;
    margin-bottom:16px;
    font-family:inherit;
  }
  .login-card input:focus{
    outline:2px solid var(--normal);
    outline-offset:1px;
  }
  .login-btn{
    width:100%;
    background:var(--brand-red);
    color:#fff;
    border:none;
    padding:11px;
    border-radius:var(--radius);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-size:13px;
    cursor:pointer;
  }
  .login-btn:hover{background:#e0304f;}
  .login-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .login-error{
    background:var(--brand-red);
    color:#fff;
    font-size:12.5px;
    padding:9px 12px;
    border-radius:var(--radius);
    margin-bottom:16px;
    display:none;
  }
  .login-error.show{display:block;}

  /* HUB */
  .hub-wrap{ display:none; max-width:960px; margin:0 auto; padding:28px 20px 60px; }
  .hub-wrap.show{display:block;}
  header.hub-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--navy);
    border-radius:var(--radius);
    padding:18px 22px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:14px;
  }
  .hub-brand{ display:flex; align-items:center; gap:12px; }
  .hub-brand img{ height:96px; width:auto; }
  .hub-brand h1{
    font-size:20px;
    margin:0;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#fff;
  }
  .hub-brand p{ margin:0; color:#9aa5c0; font-size:12px; }
  .hub-user{ display:flex; align-items:center; gap:12px; }
  .hub-user span{ font-size:12.5px; color:#9aa5c0; }
  .logout-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,0.25);
    color:#e7eaf0;
    padding:7px 14px;
    border-radius:var(--radius);
    font-size:12px;
    cursor:pointer;
  }
  .logout-btn:hover{border-color:#fff;}

  .tile-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:16px;
  }
  .tile{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    text-decoration:none;
    color:var(--text-primary);
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:border-color 0.15s ease, transform 0.1s ease;
    position:relative;
  }
  .tile.available:hover{ border-color:var(--normal); transform:translateY(-2px); }
  .tile.disabled{ opacity:0.55; cursor:default; }
  .tile-icon{ font-size:26px; }
  .app-icon-img{ width:32px; height:32px; display:block; }
  .tile-name{ font-size:16px; font-weight:600; margin:0; }
  .tile-desc{ font-size:12.5px; color:var(--text-dim); margin:0; flex:1; }
  .tile-status{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:600;
    align-self:flex-start;
    padding:3px 9px;
    border-radius:10px;
  }
  .tile-status.live{ background:#2fa36026; color:#2fa360; }
  .tile-status.soon{ background:#8a93a826; color:var(--text-dim); }

  /* VIEW CONTROLS */
  .view-controls{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .toggle-group{
    display:flex;
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
  }
  .toggle-btn{
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:11.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:7px 16px;
    cursor:pointer;
  }
  .toggle-btn.active{
    background:var(--brand-red);
    color:#fff;
  }

  /* LIST FORMAT */
  .tile-grid.format-list{
    display:flex;
    flex-direction:column;
    gap:0;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .tile-grid.format-list .tile{
    flex-direction:row;
    align-items:center;
    gap:16px;
    border:none;
    border-bottom:1px solid var(--line);
    border-radius:0;
    padding:18px 22px;
  }
  .tile-grid.format-list .tile:last-child{ border-bottom:none; }
  .tile-grid.format-list .tile:hover{ transform:none; background:var(--bg); }
  .tile-grid.format-list .tile-icon-badge{
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:#fff;flex-shrink:0;
    overflow:hidden;
  }
  .tile-grid.format-list .tile-icon-badge.has-image{ width:44px; height:44px; border-radius:12px; }
  .tile-grid.format-list .tile-icon-badge .app-icon-img{ width:100%; height:100%; }
  .tile-grid.format-list .tile.available .tile-icon-badge{ background:var(--green); }
  .tile-grid.format-list .tile.available .tile-icon-badge.has-image{ background:transparent; }
  .tile-grid.format-list .tile.disabled .tile-icon-badge{ background:var(--bg); border:1px dashed var(--line); color:var(--text-dim); }
  .tile-grid.format-list .tile.disabled .tile-icon-badge.has-image{ background:transparent; border:none; }
  .tile-grid.format-list .tile-body{ flex:1; min-width:0; }
  .tile-grid.format-list .tile-name{ margin-bottom:2px; }
  .tile-grid.format-list .tile-desc{ margin:0; }
  .tile-grid.format-list .tile-status{ flex-shrink:0; align-self:center; }

  /* STICKER FORMAT */
  .tile-grid.format-sticker{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:24px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:40px;
  }
  .tile-grid.format-sticker .tile{
    width:170px;
    border-radius:50%;
    aspect-ratio:1;
    align-items:center;
    justify-content:center;
    text-align:center;
    border:4px solid rgba(128,128,128,0.15);
    padding:18px;
    gap:6px;
    background:#ffffff;
    color:var(--navy);
  }
  html[data-theme="day"] .tile-grid.format-sticker .tile{
    background:var(--navy);
    color:#ffffff;
  }
  .tile-grid.format-sticker .tile.disabled{ opacity:0.6; }
  .tile-grid.format-sticker .tile-icon{ font-size:24px; }
  .tile-grid.format-sticker .tile-icon .app-icon-img{ width:88px; height:88px; }
  .tile-grid.format-sticker .tile-name{ font-size:12.5px; }
  .tile-grid.format-sticker .tile-desc{ display:none; }
  .tile-grid.format-sticker .tile-status{ font-size:8.5px; padding:2px 8px; background:rgba(128,128,128,0.2); align-self:center; }
  .tile-grid.format-sticker .tile.available .tile-status{ background:#2fa36026; color:var(--green); }
</style>
</head>

    name: 'Suivi transport quotidien',
    desc: 'Repérage et suivi des véhicules et déplacements en temps réel.',
    url: null,
    status: 'soon'
  }
];

let currentFormat = localStorage.getItem('toolbox-format') === 'sticker' ? 'sticker' : 'list';
let currentTheme = localStorage.getItem('toolbox-theme') === 'day' ? 'day' : 'night';

function renderTiles(){
  const grid = document.getElementById('tileGrid');
  grid.className = 'tile-grid format-' + currentFormat;
  grid.innerHTML = APPS.map(app => {
    const isLive = app.status === 'live' && app.url;
    const useAltIcon = app.dayStickerIcon && (
      (currentFormat === 'sticker' && currentTheme === 'day') ||
      (currentFormat === 'list' && currentTheme === 'night')
    );
    const displayIcon = (app.nightIcon && currentTheme === 'night')
      ? app.nightIcon
      : (useAltIcon ? app.dayStickerIcon : app.icon);
    const isImgIcon = displayIcon.indexOf('<img') !== -1;
    const statusHtml = isLive
      ? `<span class="tile-status live">Disponible</span>`
      : `<span class="tile-status soon">Bientôt</span>`;
    const tag = isLive ? 'a' : 'div';
    const hrefAttr = isLive ? `href="${app.url}"` : '';
    const tileClass = (isLive ? 'available' : 'disabled') + (isImgIcon ? ' has-img-icon' : '');
    if(currentFormat === 'list'){
      return `
        <${tag} class="tile ${tileClass}" ${hrefAttr}>
          <div class="tile-icon-badge${isImgIcon ? ' has-image' : ''}">${displayIcon}</div>
          <div class="tile-body">
            <p class="tile-name">${app.name}</p>
            <p class="tile-desc">${app.desc}</p>
          </div>
          ${statusHtml}
        </${tag}>`;
    }
    return `
      <${tag} class="tile ${tileClass}" ${hrefAttr}>
        <div class="tile-icon">${displayIcon}</div>
        <p class="tile-name">${app.name}</p>
        <p class="tile-desc">${app.desc}</p>
        ${statusHtml}
      </${tag}>`;
  }).join('');
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.querySelectorAll('[data-theme-btn]').forEach(btn=>{
    btn.classList.toggle('active', btn.getAttribute('data-theme-btn') === currentTheme);
  });
}
function applyFormat(){
  document.querySelectorAll('[data-format-btn]').forEach(btn=>{
    btn.classList.toggle('active', btn.getAttribute('data-format-btn') === currentFormat);
  });
}
document.querySelectorAll('[data-theme-btn]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTheme = btn.getAttribute('data-theme-btn');
    localStorage.setItem('toolbox-theme', currentTheme);
    applyTheme();
    renderTiles();
  });
});
document.querySelectorAll('[data-format-btn]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentFormat = btn.getAttribute('data-format-btn');
    localStorage.setItem('toolbox-format', currentFormat);
    applyFormat();
    renderTiles();
  });
});
applyTheme();
applyFormat();

function showLogin(){
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('hubWrap').classList.remove('show');
}
function showHub(user){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('hubWrap').classList.add('show');
  document.getElementById('userEmailLabel').textContent = user.email;
  renderTiles();
}

function showLoginError(msg){
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.classList.add('show');
}
function hideLoginError(){
  document.getElementById('loginError').classList.remove('show');
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  hideLoginError();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!email || !password){
    showLoginError('Entre ton courriel et ton mot de passe.');
    return;
  }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Connexion...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  btn.textContent = 'Se connecter';
  if(error){
    showLoginError('Courriel ou mot de passe incorrect.');
    return;
  }
  showHub(data.user);
});

document.getElementById('loginPassword').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  showLogin();
});

(async function init(){
  const { data } = await sb.auth.getSession();
  if(data.session && data.session.user){
    showHub(data.session.user);
  } else {
    showLogin();
  }
})();
</script>
